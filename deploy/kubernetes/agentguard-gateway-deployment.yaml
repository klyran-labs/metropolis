apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-gateway
  namespace: agentguard
  labels:
    app.kubernetes.io/name: agentguard-gateway
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentguard-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentguard-gateway
    spec:
      containers:
        - name: gateway
          image: agentguard-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: AGENTGUARD_PROFILE
              value: "testnet"
            - name: PORT
              value: "8080"
            - name: MONAD_CHAIN_ID
              value: "10143"
            - name: DEPLOYMENT_MANIFEST_PATH
              value: "/app/deploy/environments/testnet/deployment-manifest.json"
            - name: MONAD_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: monad-rpc-url
            - name: POLICY_ENGINE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: policy-engine-address
            - name: REPUTATION_REGISTRY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: reputation-registry-address
            - name: AGENT_WALLET_GUARD_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: agent-wallet-guard-address
            - name: USDC_TOKEN_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: usdc-token-address
            - name: GATEWAY_MERCHANT_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: gateway-merchant-address
            - name: PAYMASTER_VERIFICATION_GAS_LIMIT
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: paymaster-verification-gas-limit
            - name: PAYMASTER_POST_OP_GAS_LIMIT
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: paymaster-post-op-gas-limit
            - name: TENANT_MAX_CONCURRENCY
              value: "64"
            - name: MAX_TRACKED_TENANTS
              value: "10000"
            - name: PROVIDER_MAX_CONCURRENCY
              value: "32"
            - name: RPC_MAX_CONCURRENCY
              value: "128"
            - name: OPENSIGNER_URL
              value: "http://agentguard-opensigner:3001"
            - name: OPENSIGNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: opensigner-api-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: database-url
            - name: PRIVY_APP_ID
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: privy-app-id
            - name: PRIVY_ISSUER
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: privy-issuer
            - name: PRIVY_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: privy-jwks-url
            - name: INFERENCE_PRICE_BASE_UNITS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: inference-price-base-units
            - name: INFERENCE_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: inference-service-id
            - name: INFERENCE_CATEGORY
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: inference-category
            - name: EVENT_START_BLOCK
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: event-start-block
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: cors-allowed-origins
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentguard-gateway
  namespace: agentguard
spec:
  selector:
    app.kubernetes.io/name: agentguard-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-opensigner
  namespace: agentguard
  labels:
    app.kubernetes.io/name: agentguard-opensigner
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentguard-opensigner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentguard-opensigner
    spec:
      containers:
        - name: opensigner
          image: agentguard-opensigner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: OPENSIGNER_PORT
              value: "3001"
            - name: OPENSIGNER_VAULT_PATH
              value: "/data/opensigner.vault.json"
            - name: OPENSIGNER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: opensigner-master-key
            - name: OPENSIGNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: opensigner-api-token
            - name: MONAD_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: monad-rpc-url
            - name: MONAD_CHAIN_ID
              value: "10143"
            - name: POLICY_ENGINE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: policy-engine-address
            - name: AGENT_WALLET_GUARD_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: agent-wallet-guard-address
            - name: USDC_TOKEN_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: usdc-token-address
          volumeMounts:
            - name: opensigner-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: opensigner-data
          persistentVolumeClaim:
            claimName: agentguard-opensigner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentguard-opensigner
  namespace: agentguard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentguard-opensigner
  namespace: agentguard
spec:
  selector:
    app.kubernetes.io/name: agentguard-opensigner
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
