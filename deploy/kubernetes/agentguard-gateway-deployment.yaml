apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-gateway
  namespace: agentguard
  labels:
    app.kubernetes.io/name: agentguard-gateway
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentguard-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentguard-gateway
    spec:
      containers:
        - name: gateway
          image: agentguard-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: MONAD_CHAIN_ID
              value: "10143"
            - name: MONAD_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: monad-rpc-url
            - name: POLICY_ENGINE_ADDRESS
              value: "0x2222222222222222222222222222222222222222"
            - name: REPUTATION_REGISTRY_ADDRESS
              value: "0x3333333333333333333333333333333333333333"
            - name: AGENT_WALLET_GUARD_ADDRESS
              value: "0x4444444444444444444444444444444444444444"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentguard-gateway
  namespace: agentguard
spec:
  selector:
    app.kubernetes.io/name: agentguard-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
