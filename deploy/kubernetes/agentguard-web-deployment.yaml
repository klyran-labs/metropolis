apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-web
  namespace: agentguard
  labels:
    app.kubernetes.io/name: agentguard-web
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentguard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentguard-web
    spec:
      containers:
        - name: web
          image: agentguard-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentguard-web
  namespace: agentguard
spec:
  selector:
    app.kubernetes.io/name: agentguard-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
