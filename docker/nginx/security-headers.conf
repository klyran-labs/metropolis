# Single source of truth for browser security headers. nginx drops inherited add_header directives
# in any location that defines its own, so every such location includes this file instead of
# repeating the list. The Content-Security-Policy files are chosen per profile at image build time
# (see CSP_PROFILE in Dockerfile.web / Dockerfile.admin).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Reporting-Endpoints 'csp="/api/v1/telemetry/csp-report"' always;
include /etc/nginx/snippets/csp.conf;
