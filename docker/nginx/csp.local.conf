# Local development profile: identical to production plus loopback origins so a developer stack
# (anvil, gateway on another port) works. Never ships to testnet or production images.
# Enforced policy: blocks plugins, framing, base-tag injection and any script not served from this
# origin. Styles keep 'unsafe-inline' because the wallet sign-in widget injects <style> elements;
# image/font/connect sources stay on https because the widget's endpoints are not pinned yet.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; frame-src https:; worker-src 'self' blob:;" always;

# Staged policy: the end state with every source pinned, delivered as Report-Only so violations are
# logged by the gateway (target "csp") instead of breaking sign-in. Promote it to enforced once a
# release cycle shows no unexpected reports. __RPC_ORIGIN__ is filled in at image build time.
add_header Content-Security-Policy-Report-Only "default-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __RPC_ORIGIN__ ws://localhost:* ws://127.0.0.1:* https://auth.privy.io https://*.privy.io https://*.rpc.privy.systems wss://relay.walletconnect.com wss://relay.walletconnect.org https://explorer-api.walletconnect.com; frame-src https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org https://challenges.cloudflare.com; child-src https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org; worker-src 'self' blob:; manifest-src 'self'; report-uri /api/v1/telemetry/csp-report; report-to csp;" always;
