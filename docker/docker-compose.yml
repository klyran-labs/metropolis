services:
  # Local Monad EVM Node (Chain ID 10143, 400ms Block Time Physics)
  monad-local:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--chain-id"
      - "10143"
      - "--block-time"
      - "0.4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
    ports:
      - "8545:8545"
    restart: always

  # Nginx Gateway & Reverse Proxy (Rate Limiting, Static Assets, WebSocket Hub)
  nginx-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_APP_ENV: development
    ports:
      - "80:80"
    depends_on:
      - computex-engine
      - monad-local
    restart: always

  # Core Execution Engine (Rust + memmap2 WAL + In-Memory CLOB)
  computex-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    ports:
      - "9101:9101"
      - "9003:9003"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cpuset: "0"
    environment:
      - RUST_LOG=info
      - COMPUTEX_WS_PORT=9101
      - COMPUTEX_WAL_PATH=/var/data/computex_engine.wal

      - COMPUTEX_CPU_CORE=0
      - COMPUTEX_ENABLE_MLOCK=true
      - MONAD_RPC_URL=http://monad-local:8545
      - MONAD_CHAIN_ID=10143
    volumes:
      - engine-wal-data:/var/data
    depends_on:
      - monad-local
    restart: always

  # 3-of-5 SLA Telemetry Oracle & Embedded DuckDB Analytics
  computex-oracle:
    build:
      context: ..
      dockerfile: docker/Dockerfile.oracle
    ports:
      - "9002:9002"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    environment:
      - RUST_LOG=info
      - DUCKDB_PATH=/var/data/computex_telemetry.duckdb
      - MONAD_RPC_URL=http://monad-local:8545
      - MONAD_CHAIN_ID=10143
      # Local-only deployment manifest; production uses docker-compose.prod.yml
      # and requires an injected non-zero address.
      - SLA_VAULT_ADDRESS=${SLA_VAULT_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
    volumes:
      - duckdb-data:/var/data
    depends_on:
      - computex-engine
      - monad-local
    restart: always


volumes:
  engine-wal-data:
  duckdb-data:
