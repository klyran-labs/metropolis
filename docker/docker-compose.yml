services:
  agentguard-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_APP_ENV: production
        VITE_CHAIN_ID: "10143"
        VITE_RPC_URL: https://testnet-rpc.monad.xyz
        VITE_POLICY_ENGINE_ADDRESS: "0x2222222222222222222222222222222222222222"
        VITE_REPUTATION_REGISTRY_ADDRESS: "0x3333333333333333333333333333333333333333"
        VITE_AGENT_WALLET_GUARD_ADDRESS: "0x4444444444444444444444444444444444444444"
        VITE_USDC_TOKEN_ADDRESS: "0xf817257fed379853cDe0fa4F97AB987181B1E5Ea"
        VITE_PRIVY_APP_ID: cmton65ao004l0cl11tgmwiah
    container_name: agentguard-web
    restart: unless-stopped
    ports:
      - "3110:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - agentguard-network

  agentguard-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: agentguard-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONAD_CHAIN_ID=10143
      - MONAD_RPC_URL=https://testnet-rpc.monad.xyz
      - POLICY_ENGINE_ADDRESS=${POLICY_ENGINE_ADDRESS:-0x2222222222222222222222222222222222222222}
      - REPUTATION_REGISTRY_ADDRESS=${REPUTATION_REGISTRY_ADDRESS:-0x3333333333333333333333333333333333333333}
      - AGENT_WALLET_GUARD_ADDRESS=${AGENT_WALLET_GUARD_ADDRESS:-0x4444444444444444444444444444444444444444}
      - USDC_TOKEN_ADDRESS=${USDC_TOKEN_ADDRESS:-0xf817257fed379853cDe0fa4F97AB987181B1E5Ea}
      - GATEWAY_MERCHANT_ADDRESS=${GATEWAY_MERCHANT_ADDRESS:-0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC}
      # Intentionally NOT defaulted: without this, the gateway boots and
      # serves challenges/policy simulation but returns 503 on settlement
      # (see services/gateway/README.md). Supply it via a real secret store
      # in production, never a checked-in default.
      - GATEWAY_RELAYER_PRIVATE_KEY=${GATEWAY_RELAYER_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - agentguard-network

networks:
  agentguard-network:
    driver: bridge
