name: AgentGuard CI / CD Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis-and-lint:
    name: Static Analysis, Typechecks & Zero-Mock Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Descriptor Validation Dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify Production UI Interaction Contract
        run: node scripts/verify-ui-contract.mjs

      - name: Validate ERC-7730 Descriptors
        run: |
          node scripts/validate-erc7730.mjs
          python3 scripts/validate-erc7730-schema.py

      - name: Verify Zero-Mock Production Integrity
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn --exclude="*.test.*" --exclude="*.spec.*" -E 'Math\.random|0x70997970C51812dc3A010C7d01b50e0d17dc79C8' apps/web/src; then
            echo "Prohibited mock or fallback data found in apps/web/src"
            exit 1
          fi
          test -s apps/web/src/configuration.ts

      - name: Typecheck TypeScript Workspaces
        run: |
          npx tsc --noEmit --project packages/shared-types/tsconfig.json
          npx tsc --noEmit --project packages/x402-middleware/tsconfig.json
          npx tsc --noEmit --project apps/web/tsconfig.json

  contracts-foundry:
    name: Solidity Contracts (Foundry build, unit, fuzz, invariant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge Build (real compiled bytecode)
        working-directory: contracts
        run: forge build --sizes

      - name: Forge Test (unit + 5000-run fuzz + 500x128 invariant)
        working-directory: contracts
        run: forge test -vvv

      - name: Slither Static Analysis (informational)
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: contracts/
          fail-on: none

  full-test-suite:
    name: AgentGuard Monad Contracts & Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Packages
        run: |
          npm run build --workspace=@agentguard/shared-types
          npm run build --workspace=@agentguard/x402-middleware

      - name: Run Monad Smart Contracts Test Suite
        run: node --test contracts/test/agentguard-contracts.test.mjs

      - name: Run React 19 Frontend Tests
        run: node --test apps/web/test/frontend.test.mjs

      - name: Run x402 / AP2 Middleware Tests
        run: node --test packages/x402-middleware/test/middleware.test.mjs

      - name: Build Local-Profile Web Console
        env:
          VITE_APP_ENV: local
          VITE_CHAIN_ID: 10143
          VITE_PRIVY_APP_ID: cmton65ao004l0cl11tgmwiah
        run: npm run build --workspace=@agentguard/web

  container-builds:
    name: Runtime Container Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate all runtime compose profiles
        run: |
          docker compose -f docker/docker-compose.yml config --no-interpolate --quiet
          docker compose -f docker/docker-compose.testnet.yml config --no-interpolate --quiet
          docker compose -f docker/docker-compose.mainnet.yml config --no-interpolate --quiet

      - name: Build Production Gateway Image
        run: docker build -f docker/Dockerfile.gateway .

  rust-gateway:
    name: Rust Gateway Tests and Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path services/gateway/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path services/gateway/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path services/gateway/Cargo.toml --all-targets -- -D warnings

  postgres-migrations:
    name: PostgreSQL 18 Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agentguard
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentguard -d agentguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: ci-password
        run: |
          for migration in services/gateway/migrations/*.sql; do
            psql -h 127.0.0.1 -U agentguard -d agentguard -v ON_ERROR_STOP=1 -f "$migration"
          done
          test "$(psql -At -h 127.0.0.1 -U agentguard -d agentguard -c 'SELECT uuid_extract_version(uuidv7())')" = "7"
