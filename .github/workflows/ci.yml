name: AgentGuard CI / CD Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis-and-lint:
    name: Static Analysis, Typechecks & Zero-Mock Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Descriptor Validation Dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify Production UI Interaction Contract
        run: node scripts/verify-ui-contract.mjs

      - name: Validate ERC-7730 Descriptors
        run: |
          node scripts/validate-erc7730.mjs
          python3 scripts/validate-erc7730-schema.py

      - name: Verify Zero-Mock Production Integrity
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn --exclude="*.test.*" --exclude="*.spec.*" -E 'Math\.random|0x70997970C51812dc3A010C7d01b50e0d17dc79C8' apps/web/src; then
            echo "Prohibited mock or fallback data found in apps/web/src"
            exit 1
          fi
          test -s apps/web/src/config/env.ts

      - name: Typecheck TypeScript Workspaces
        run: |
          npx tsc --noEmit --project packages/shared-types/tsconfig.json
          npx tsc --noEmit --project packages/x402-middleware/tsconfig.json
          npx tsc --noEmit --project apps/web/tsconfig.json

  contracts-foundry:
    name: Solidity Contracts (Foundry build, unit, fuzz, invariant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge Build (real compiled bytecode)
        working-directory: contracts
        run: forge build --sizes

      - name: Forge Test (unit + 5000-run fuzz + 500x128 invariant)
        working-directory: contracts
        run: forge test -vvv

      - name: Slither Static Analysis (informational)
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: contracts/
          fail-on: none

  full-test-suite:
    name: AgentGuard Monad Contracts & Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Packages
        run: |
          npm run build --workspace=@agentguard/shared-types
          npm run build --workspace=@agentguard/x402-middleware

      - name: Run Monad Smart Contracts Test Suite
        run: node --test contracts/test/agentguard-contracts.test.mjs

      - name: Run React 19 Frontend Tests
        run: node --test apps/web/test/frontend.test.mjs

      - name: Run x402 / AP2 Middleware Tests
        run: node --test packages/x402-middleware/test/middleware.test.mjs

      - name: Run Live Protocol Simulation Demo
        run: node scripts/agentguard-live-demo.mjs

      - name: Build Production Web Console With Explicit Configuration
        env:
          VITE_APP_ENV: production
          VITE_CHAIN_ID: 10143
          VITE_RPC_URL: https://testnet-rpc.monad.xyz
          VITE_WS_URL: wss://testnet-rpc.monad.xyz
          VITE_POLICY_ENGINE_ADDRESS: 0x2222222222222222222222222222222222222222
          VITE_REPUTATION_REGISTRY_ADDRESS: 0x3333333333333333333333333333333333333333
          VITE_AGENT_WALLET_GUARD_ADDRESS: 0x4444444444444444444444444444444444444444
          VITE_USDC_TOKEN_ADDRESS: 0xf817257fed379853cDe0fa4F97AB987181B1E5Ea
          VITE_PRIVY_APP_ID: cmton65ao004l0cl11tgmwiah
        run: npm run build --workspace=@agentguard/web

  container-builds:
    name: Production Docker Container Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Stack
        run: docker compose -f docker/docker-compose.yml build

      - name: Build Production Web Image With Explicit Configuration
        run: |
          docker build -f docker/Dockerfile.web \
            --build-arg VITE_APP_ENV=production \
            --build-arg VITE_CHAIN_ID=10143 \
            --build-arg VITE_RPC_URL=https://testnet-rpc.monad.xyz \
            --build-arg VITE_WS_URL=wss://testnet-rpc.monad.xyz \
            --build-arg VITE_POLICY_ENGINE_ADDRESS=0x2222222222222222222222222222222222222222 \
            --build-arg VITE_REPUTATION_REGISTRY_ADDRESS=0x3333333333333333333333333333333333333333 \
            --build-arg VITE_AGENT_WALLET_GUARD_ADDRESS=0x4444444444444444444444444444444444444444 \
            --build-arg VITE_USDC_TOKEN_ADDRESS=0xf817257fed379853cDe0fa4F97AB987181B1E5Ea \
            --build-arg VITE_PRIVY_APP_ID=cmton65ao004l0cl11tgmwiah .

      - name: Build Production Gateway Image
        run: docker build -f docker/Dockerfile.gateway .
