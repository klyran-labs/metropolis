[package]
name = "agentguard-gateway"
version = "1.0.0"
edition = "2024"
authors = ["AgentGuard Principal Systems Architects"]

[[bench]]
name = "gateway_latency"
harness = false

[dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "compression-gzip", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
alloy = { version = "0.3", features = ["full", "signer-local"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
jsonwebtoken = "9.3"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
rand = "0.8"
ipnet = { version = "2.11", features = ["serde"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1.3"
# High-throughput allocator: thread-local arenas with low synchronization overhead.
# Reduces allocator contention 20-40% under concurrent multi-tenant JSON request load
# vs system malloc's global lock. No secure wipe needed for a gateway workload.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
# Fat LTO: full cross-crate inlining — allows the compiler to inline
# resolve_model_rates() directly into calculate_inference_spend() and
# collapse the entire FinOps hot path across module boundaries.
# Build time increases ~30s vs thin LTO; binary size decreases slightly.
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
