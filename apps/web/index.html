<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentGuard | Agentic Risk & Spend Control Layer for Monad Metropolis</title>
    <meta
      name="description"
      content="Agentic risk management and spend control layer for autonomous payments on Monad Parallel EVM."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("agentguard-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "dark" || (stored !== "light" && prefersDark) ? "dark" : "light";
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
